services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mi_boletin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - mbj_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mi_boletin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mbj_postgres:
